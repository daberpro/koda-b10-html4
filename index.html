<!DOCTYPE html>
<html>

<head>
    <title>HTML table layout</title>
</head>

<body>

    <table width="100%" height="1000px" border="1">
        <tbody>
            <tr align="center">
                <td colspan="2">
                    <font size="20px" color="green">
                        &lt;Header&gt;
                    </font>
                </td>
            </tr>
            <tr align="center">
                <td colspan="2">
                    <font size="20px" color="blue">&lt;Nav&gt;</font>
                </td>
            </tr>
            <tr align="center">
                <td colspan="1">
                    <font size="20px" color="purple">&lt;section&gt;</font>
                </td>
                <td colspan="1" rowspan="2">
                    <font size="20px" color="lightgreen">&lt;aside&gt;</font>
                </td>
            </tr>
            <tr align="center">
                <td colspan="1">
                    <font size="20px" color="skyblue">&lt;article&gt;</font>
                </td>
            </tr>
            <tr align="center">
                <td colspan="2">
                    <font size="20px" color="red">&lt;footer&gt;</font>
                </td>
            </tr>
        </tbody>
    </table>

</body>

</html>
