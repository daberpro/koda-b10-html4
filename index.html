<!DOCTYPE html>
<html>
<head>
    <title>HTML table layout</title>
</head>
<body>
    
    <table border="1">
        <tbody>
            <tr align="center">
                <td colspan="2">&lt;Header&gt;</td>
            </tr>
            <tr align="center">
                <td colspan="2">&lt;Nav&gt;</td>
            </tr>
            <tr align="center">
                <td colspan="1">&lt;section&gt;</td>
                <td  colspan="1" rowspan="2">&lt;aside&gt;</td>
            </tr>
            <tr align="center">
                <td colspan="1">&lt;article&gt;</td>
            </tr>
            <tr align="center">
                <td colspan="2">&lt;footer&gt;</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
